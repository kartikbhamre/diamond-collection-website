<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Diamond Collection and Bags</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="config.js"></script>
</head>
<body>
    <header>
        <div class="header-left">Diamond Collection and Bags</div>
        <div class="header-center">
            <input type="search" id="searchInput" placeholder="Search products..." />
        </div>
        <div class="header-right">
            <div id="accountIcon">Account</div>
            <div id="cartIcon">Cart (<span id="cartCount">0</span>)</div>
        </div>
    </header>

    <nav>
        <ul id="categoryList">
            <li data-category="mens">Men's Clothing</li>
            <li data-category="womens">Women's Clothing</li>
            <li data-category="childrens">Children's Clothing</li>
            <li data-category="bags">Bags</li>
        </ul>
    </nav>

    <main>
        <div id="productGrid"></div>
    </main>

    <div id="cartSidebar" class="hidden">
        <h2>Shopping Cart</h2>
        <div id="cartItems"></div>
        <div id="cartSummary">
            <div>Subtotal: ₹<span id="subtotal">0</span></div>
            <button id="checkoutBtn">Proceed to Checkout</button>
        </div>
        <button id="closeCart">Close</button>
    </div>

    <div id="checkoutModal" class="hidden">
        <h2>Checkout</h2>
        <form id="checkoutForm">
            <label>
                Name: <input type="text" id="name" required />
            </label>
            <label>
                Email: <input type="email" id="email" required />
            </label>
            <label>
                Phone: <input type="tel" id="phone" required />
            </label>
            <label>
                Address: <textarea id="address" required></textarea>
            </label>
            <button type="submit">Pay Now</button>
        </form>
        <button id="closeCheckout">Cancel</button>
    </div>

    <div id="toast" class="hidden"></div>

    <script src="script.js"></script>
</body>
</html>
